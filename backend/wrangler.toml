name = "thermohub-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "thermohub"
database_id = "REPLACE_WITH_D1_DATABASE_ID"   # from: npx wrangler d1 create thermohub

[vars]
# Application (client) ID of the multi-tenant Entra app registration.
ENTRA_CLIENT_ID = "REPLACE_WITH_CLIENT_ID"
# Your own Microsoft 365 tenant ID; platform admins must sign in from it.
PLATFORM_TENANT_ID = "REPLACE_WITH_YOUR_TENANT_ID"
# Comma-separated platform admin sign-in emails.
PLATFORM_ADMIN_EMAILS = "justin@pipelineequipment.com"
# Comma-separated origins allowed to call the API (the dashboard's address).
ALLOWED_ORIGINS = "http://localhost:8788"
